<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Daily Roster Viewer</title>

<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>

<style>
body { font-family: "Segoe UI", Arial, sans-serif; background:#f4f9fc; margin:0; color:#222; }
header { background:#007acc; color:#fff; padding:12px 0; text-align:center; font-weight:700; position:sticky; top:0; }
.wrap { max-width:480px; margin:18px auto; padding:12px; background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
.controls { display:flex; gap:8px; justify-content:space-between; align-items:center; }
input[type="date"] { flex:1; padding:8px; border-radius:8px; border:1px solid #ccc; }
button { background:#007acc; color:#fff; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; }
button:hover{background:#005f9e}
table { width:100%; border-collapse:collapse; margin-top:12px; }
th, td { padding:8px; border-bottom:1px solid #e6eef5; text-align:center; }
th { background:#abd6de; font-weight:700; }
.no-data{ text-align:center; color:#777; padding:16px 0; }
.created-at { text-align:right; font-size:12px; color:#555; margin-top:6px; }
@media (max-width:360px){ th, td{padding:6px; font-size:13px} }
</style>

</head>

<body>

<header>Daily Roster Viewer
<button id="installBtn" style="display:none;float:right;margin-right:10px">
📲 Install App
</button>

</header>



<div class="wrap">

<div class="controls">
<button onclick="changeDay(-1)">◀ Prev</button>
<input type="date" id="rosterDate">
<button onclick="changeDay(1)">Next ▶</button>
</div>

<div class="controls toggle" style="margin-top:8px">
<button id="b8" onclick="setMode('8h')">8 Hours</button>
<button id="b6" class="active" onclick="setMode('6h')">6 Hours</button>
</div>

<div id="dayBox"></div>
<div id="nightBox"></div>

</div>

<script>
/* 🔥 FIREBASE CONFIG */
firebase.initializeApp({
 apiKey:"AIzaSyANN1IPnC6vODqIWiOpZgWutnP-LlmH48s",
 authDomain:"gelanigama-roster-team-a.firebaseapp.com",
 projectId:"gelanigama-roster-team-a"
});

const db=firebase.firestore();

let currentDate=new Date();
let currentMode="6h";
const TEAM="team2Roster";   // change if needed

document.getElementById("rosterDate").value=currentDate.toISOString().split("T")[0];

/* ---------------- */

function setMode(m){
 currentMode=m;
 b8.classList.toggle("active",m==="8h");
 b6.classList.toggle("active",m==="6h");
 load();
}

function changeDay(n){
 currentDate.setDate(currentDate.getDate()+n);
 rosterDate.value=currentDate.toISOString().split("T")[0];
 load();
}

rosterDate.onchange=e=>{
 currentDate=new Date(e.target.value);
 load();
}

/* ---------------- LOAD FIRESTORE ---------------- */

async function load(){

 dayBox.innerHTML="Loading...";
 nightBox.innerHTML="";

 const id=currentDate.toISOString().split("T")[0];

 const teams=["team1Roster","team2Roster","team3Roster"];

 let dayRows=[];
 let nightRows=[];

 try{

 for(const t of teams){

   const doc=await db.collection(t).doc(id).get();
   if(!doc.exists) continue;

   const d=doc.data();
   if(d.offDay) continue;

   const rows=d.tellers||[];
   if(!rows.length) continue;

   const shift=rows[0].shift;

   if(shift==="day") dayRows=rows;
   if(shift==="night") nightRows=rows;
 }

 render("DAY TEAM",dayRows,dayBox);
 render("NIGHT TEAM",nightRows,nightBox);

 }catch(e){
 dayBox.innerHTML=e.message;
 }

}

/* ---------------- RENDER TABLE ---------------- */

function render(title,list,box){

 if(list.length===0){
   box.innerHTML=`<div class="no">${title} empty</div>`;
   return;
 }

 let h=`<div class="title">${title}</div>
 <table>
 <tr><th>Teller</th><th>Booth</th></tr>`;

 list.forEach(r=>{
   const booth=currentMode==="8h"?r.booth8:r.booth6;
   h+=`<tr><td>${r.teller||"-"}</td><td>${booth||"-"}</td></tr>`;
 });

 h+="</table>";
 box.innerHTML=h;
}

load();
let deferredPrompt;
const installBtn=document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", e=>{
 e.preventDefault();
 deferredPrompt=e;
 installBtn.style.display="inline-block";
});

installBtn.addEventListener("click", async ()=>{
 if(!deferredPrompt) return;

 deferredPrompt.prompt();
 await deferredPrompt.userChoice;

 deferredPrompt=null;
 installBtn.style.display="none";
});
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
